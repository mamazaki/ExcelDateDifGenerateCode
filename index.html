<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate DATEDIF Code</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container my-5">
  <h1 class="mb-4">Generate DATEDIF Code</h1>

  <form id="datedifForm">
    <!-- Input Method Selection -->
    <div class="mb-3">
      <label class="form-label">Input Method:</label>
      <select id="inputMethod" class="form-select">
        <option value="separate">Separate Day, Month, Year</option>
        <option value="single">Single Field (DD/MM/YYYY)</option>
      </select>
    </div>

    <!-- Separate Input Fields -->
    <div id="separateInputs" class="mb-3">
      <label class="form-label">Day (Excel Cell Reference, e.g., A1):</label>
      <input type="text" id="dayInput" class="form-control" placeholder="Enter cell reference (e.g., A1)" />
      <label class="form-label mt-2">Month (Excel Cell Reference, e.g., B1):</label>
      <input type="text" id="monthInput" class="form-control" placeholder="Enter cell reference (e.g., B1)" />
      <label class="form-label mt-2">Year (Excel Cell Reference, e.g., C1):</label>
      <input type="text" id="yearInput" class="form-control" placeholder="Enter cell reference (e.g., C1)" />
    </div>

    <!-- Single Input Field -->
    <div id="singleInput" class="mb-3 d-none">
      <label class="form-label">Date (DD/MM/YYYY or Excel Cell Reference, e.g., D1):</label>
      <input type="text" id="dateInput" class="form-control" placeholder="Enter date or cell reference (e.g., D1)" />
    </div>

    <!-- Year Format Selection -->
    <div class="mb-3">
      <label class="form-label">Year Format:</label>
      <select id="yearFormat" class="form-select">
        <option value="ad">AD (e.g., 1990)</option>
        <option value="be">BE (e.g., 2533)</option>
      </select>
    </div>

    <!-- Unit Selection -->
    <div class="mb-3">
      <label class="form-label">Select Unit:</label>
      <select id="unitInput" class="form-select">
        <option value="Y">Years ("Y")</option>
        <option value="M">Months ("M")</option>
        <option value="D">Days ("D")</option>
        <option value="MD">Days (Ignoring Months and Years) ("MD")</option>
        <option value="YM">Months (Ignoring Years) ("YM")</option>
        <option value="YD">Days (Ignoring Years) ("YD")</option>
      </select>
    </div>

    <button type="button" id="generateCode" class="btn btn-primary">Generate DATEDIF Code</button>
  </form>

  <h2 class="mt-4">Generated Code:</h2>
  <textarea id="output" class="form-control" rows="4" readonly></textarea>
</div>

<script>
  document.getElementById('inputMethod').addEventListener('change', function () {
    const method = this.value;
    document.getElementById('separateInputs').classList.toggle('d-none', method !== 'separate');
    document.getElementById('singleInput').classList.toggle('d-none', method !== 'single');
  });

  document.getElementById('generateCode').addEventListener('click', () => {
    const inputMethod = document.getElementById('inputMethod').value;
    const yearFormat = document.getElementById('yearFormat').value;
    const unit = document.getElementById('unitInput').value;
    let day, month, year;

    if (inputMethod === 'separate') {
      day = document.getElementById('dayInput').value;
      month = document.getElementById('monthInput').value;
      year = document.getElementById('yearInput').value;
    } else {
      const dateReference = document.getElementById('dateInput').value;
      if (!dateReference) {
        alert('Please provide a valid date or cell reference.');
        return;
      }
      const formula = `=DATEDIF(${dateReference}, TODAY(), "${unit}")`;
      document.getElementById('output').value = formula;
      return;
    }

    if (yearFormat === 'be') {
      year = `${year}-543`;
    }

    if (!day || !month || !year) {
      alert('Please fill in all the fields!');
      return;
    }

    const formula = `=DATEDIF(DATE(${year}, ${month}, ${day}), TODAY(), "${unit}")`;
    document.getElementById('output').value = formula;
  });
</script>
</body>
</html>
